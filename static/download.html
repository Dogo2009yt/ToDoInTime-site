<body>
    <!--NAVBAR-->
    <nav class="navbar navbar-expand-lg sticky-top bg-black" data-bs-theme="dark" style="height: 10vh;">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <img src="img/icon.svg" alt="Logo" style="height: 8vh; border-radius: 20%;">
                ToDoInTime</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="aboutus.html">About us</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="download.html">Download</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/docs/index.html">Docs</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <br>

    <div class="container">
        <img src="img/icon.svg" alt="Logo">
        <h1>ToDoInTime</h1>
        <button type="button" class="btn btn-primary btn-lg" id="downloadFor">Download for ...</button>
        <table class="table table-striped table-bordered" style="text-align: center; margin: 5vh;">
            <thead>
                <tr>
                    <th scope="col">OS</th>
                    <th scope="col">Download</th>
                </tr>
            </thead>
            <tbody class="table-group-divider">
                <tr>
                    <th scope="row">Windows</th>
                    <td><a href="">
                        Download for Windows
                    </a></td>
                </tr>
                <tr>
                    <th scope="row">Linux</th>
                    <td><a href="">
                        Download for Linux
                    </a></td>
                </tr>
                <tr>
                    <th scope="row">Android</th>
                    <td><a href="">
                        Download for Android
                    </a></td>
                </tr>
                <tr>
                    <th scope="row">Source code</th>
                    <td><a href="">
                        Download Source code
                    </a></td>
                </tr>
            </tbody>
        </table>
    </div>


    <div class="foot">
        <h5>© ToDoInTime 2026</h5>
        <a href="https://github.com/Masterpat48/ToDoInTime">
            <img src="img/github.svg" alt="">
        </a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>

    <script>
        let os = "Unknown";
        const userAgent = navigator.userAgent;
        const downloadFor = document.getElementById("downloadFor");

        if (/iPhone|iPad|iPod/.test(userAgent)) os = "iOS";
        else if (userAgent.includes("Android")) os = "Android";
        else if (userAgent.includes("Mac")) os = "MacOS";
        else if (userAgent.includes("Win")) os = "Windows";
        else if (userAgent.includes("Linux")) os = "Linux";

        if (os === "MacOS" || os === "iOS") {
            downloadFor.textContent = "Download for your os";
            downloadFor.onclick = "#table"
        } else {
            downloadFor.textContent = "Download for " + os;
        }
    </script>
</body>

</html>
